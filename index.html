<audio id="audio" src="mood.mp3" preload="metadata"></audio><script>const data=[["Few behaviours are as universally recognised, yet as routinely misdiagnosed, as procrastination: the voluntary deferral of a necessary task in favour of pursuits that are less pressing, more agreeable and considerably less demanding.", "Ít hành vi nào vừa được nhận biết rộng rãi, vừa thường xuyên bị hiểu sai như sự trì hoãn: việc tự nguyện hoãn một nhiệm vụ cần thiết để ưu tiên những hoạt động ít cấp bách hơn, dễ chịu hơn và ít đòi hỏi hơn đáng kể."], ["Hardly anyone is immune.", "Hầu như không ai tránh khỏi điều này."], ["Whether the obligation in question is a difficult message to a friend whom one is about to disappoint, or a report on which a qualification or livelihood may depend, the procrastinator typically retains a clear-eyed awareness that the moment for action has arrived, and yet stays put.", "Dù trách nhiệm đang nói đến là một tin nhắn khó mở lời gửi cho người bạn mà mình sắp làm thất vọng, hay một bản báo cáo có thể quyết định việc đạt được bằng cấp hoặc kế sinh nhai, người hay trì hoãn thường vẫn nhận thức rõ rằng đã đến lúc phải hành động, nhưng lại không nhúc nhích."], ["Indeed, the paradox is that those who know best what they ought to be doing are frequently the most adept at finding something else to do.", "Thật vậy, nghịch lý nằm ở chỗ những người biết rõ nhất mình nên làm gì lại thường là những người giỏi nhất trong việc tìm ra một việc khác để làm."], ["Were self-reproach an effective remedy, the problem would long since have been solved; it is, on the contrary, among the least helpful responses available.", "Nếu việc tự trách bản thân là một cách khắc phục hiệu quả, vấn đề hẳn đã được giải quyết từ lâu; trái lại, đó là một trong những cách phản ứng ít hữu ích nhất."], ["That matters all the more because, as the author's own research indicates, the consequences of chronic delay extend well beyond squandered hours.", "Điều đó càng đáng quan tâm hơn bởi, như nghiên cứu của chính tác giả chỉ ra, hậu quả của việc trì hoãn kéo dài vượt xa những giờ đồng hồ bị lãng phí."], ["It is conventional to attribute dilatoriness to indolence or to an inability to budget one's time.", "Người ta thường quy sự chậm trễ cho tính lười biếng hoặc cho việc không biết phân bổ thời gian của mình."], ["Yet the weight of empirical evidence points elsewhere: what is at stake is less the management of the clock than the management of mood.", "Tuy nhiên, bằng chứng thực nghiệm thuyết phục lại chỉ về một hướng khác: vấn đề chủ yếu nằm ở việc quản lý tâm trạng hơn là quản lý thời gian."]];
